[project]
name = "frontend"
version = "0.1.0"
description = "Streamlit frontend for alpha-kabu-ai"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]

