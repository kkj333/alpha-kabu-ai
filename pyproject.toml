[project]
name = "alpha-kabu-ai"
version = "0.1.0"
description = "AI for finding alpha in Japanese stock market"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff", "ty"]

[tool.uv.workspace]
members = ["backend", "frontend"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
